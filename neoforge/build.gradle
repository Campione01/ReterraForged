import java.nio.file.FileSystems
import java.nio.file.Files
import java.nio.file.attribute.BasicFileAttributeView

plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    
    runs {
        client {
            ideConfigGenerated(true)
        }
    }

    runs {
        data {
            data()
            programArgs "--all", "--mod", "reterraforged"
            programArgs "--output", file('src/generated/resources').absolutePath
            programArgs "--existing", file('src/generated/resources').absolutePath
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    
//	compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
//  modImplementation("com.github.glitchfiend:TerraBlender-forge:${rootProject.minecraft_version}-${rootProject.terrablender_version}")
    
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                "src/generated/resources"
            ]
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("shadow")
}

remapJar {
    atAccessWideners.add('reterraforged.accesswidener')

    input.set shadowJar.archiveFile
    dependsOn shadowJar

    doLast {
        // Loom emits the generated access rules in unspecified order.
        FileSystems.newFileSystem(archiveFile.get().asFile.toPath(), Collections.emptyMap()).withCloseable { zip ->
            def rules = zip.getPath('/META-INF/accesstransformer.cfg')
            def times = Files.getFileAttributeView(rules, BasicFileAttributeView)
            def original = times.readAttributes()
            def lines = Files.readAllLines(rules)
            Files.writeString(rules, lines.sort().join('\n') + '\n')
            times.setTimes(original.lastModifiedTime(), original.lastAccessTime(), original.creationTime())
        }
    }
}

jar {
    archiveClassifier.set("dev")
}

processResources {
    duplicatesStrategy "exclude"
}

sourcesJar {
    duplicatesStrategy "exclude"
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
